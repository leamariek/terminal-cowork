<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>terminal-cowork</title>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="corner">
  <div id="lights">
    <button class="light close" data-control="close" aria-label="Close window"><svg viewBox="0 0 12 12"><path d="M3.8 3.8l4.4 4.4M8.2 3.8L3.8 8.2"/></svg></button>
    <button class="light minimize" data-control="minimize" aria-label="Minimize window"><svg viewBox="0 0 12 12"><path d="M3 6h6"/></svg></button>
    <button class="light zoom" data-control="zoom" aria-label="Zoom window"><svg viewBox="0 0 12 12"><path class="fill" d="M3.4 4.7v3.9h3.9zM8.6 7.3V3.4H4.7z"/></svg></button>
  </div>
  <button id="toggle-sidebar" aria-label="Show or hide the sidebar"><svg viewBox="0 0 18 16"><rect x="1.5" y="2" width="15" height="12" rx="3"/><path d="M6.5 2v12"/></svg></button>
</div>
<aside id="sidebar">
  <button id="row-agents" class="row"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="3.2" height="10" rx="1"/><rect x="6.4" y="3" width="3.2" height="6.5" rx="1"/><rect x="10.8" y="3" width="3.2" height="8" rx="1"/></svg><span class="name">Agents</span><span id="agents-count" class="count"></span></button>
  <h2 class="with-action">Terminals<button id="add-terminal" aria-label="New terminal" aria-haspopup="menu"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button></h2>
  <div id="add-menu" role="menu" hidden>
    <button role="menuitem" data-kind="claude">Claude Code</button>
    <button role="menuitem" data-kind="grok">Grok</button>
    <button role="menuitem" data-kind="shell">Shell</button>
  </div>
  <div id="term-list"></div>
  <h2>Browser</h2>
  <div id="web-tabs"></div>
  <div id="preview-group" hidden>
    <h2>Preview</h2>
    <div id="preview-tabs"></div>
  </div>
  <button id="row-appearance" class="row" aria-haspopup="dialog" title="Appearance (Ctrl+,)"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path class="fill" d="M8 2.4a5.6 5.6 0 010 11.2z"/></svg><span class="name">Appearance</span></button>
</aside>
<main id="main">
  <header id="toolbar">
    <div class="capsule pair">
      <button id="back" aria-label="Back"><svg viewBox="0 0 16 16"><path d="M10 2.8L4.8 8l5.2 5.2"/></svg></button>
      <i class="rule"></i>
      <button id="forward" aria-label="Forward"><svg viewBox="0 0 16 16"><path d="M6 2.8L11.2 8 6 13.2"/></svg></button>
    </div>
    <h1 id="title">Claude Code</h1>
    <form id="address-form" class="capsule">
      <svg id="lock" viewBox="0 0 16 16"><path class="fill" d="M5 7V5a3 3 0 016 0v2h.6c.5 0 .9.4.9.9v4.7c0 .5-.4.9-.9.9H4.4a.9.9 0 01-.9-.9V7.9c0-.5.4-.9.9-.9zm1.2 0h3.6V5a1.8 1.8 0 00-3.6 0z"/></svg>
      <input id="address" spellcheck="false" autocomplete="off" placeholder="Search or enter website name" aria-label="Address">
      <button id="reload" type="button" aria-label="Reload page"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 11-1.5-3.6M13 2v3h-3"/></svg></button>
      <div id="progress"></div>
    </form>
    <div class="capsule">
      <button id="point" aria-label="Point at an element for Claude" title="Point at an element for Claude"><svg viewBox="0 0 16 16"><path d="M3.5 2.5l9 4-3.8 1.6-1.6 3.8z"/></svg><span>Point</span></button>
      <i class="rule"></i>
      <button id="hold" aria-label="Take control of the browser" title="Pause Claude in the browser"><svg viewBox="0 0 16 16"><path d="M5 3v10M11 3v10"/></svg><span>Take control</span></button>
    </div>
    <button id="new-tab" class="capsule round" aria-label="New tab"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
  </header>
  <div id="split">
    <div id="terminal"></div>
    <div id="divider" role="separator" aria-orientation="vertical" aria-label="Resize panes"></div>
    <div id="stage"></div>
  </div>
  <section id="board" aria-label="Agents" hidden></section>
  <footer id="status" role="status">Shared with Claude</footer>
</main>
<div id="sheet-veil" hidden>
  <section id="appearance" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="appearance-title">
    <header><h2 id="appearance-title">Appearance</h2><button id="appearance-done" class="done">Done</button></header>
    <div class="group">
      <div class="setting">
        <span class="label">Appearance</span>
        <div class="tiles" role="radiogroup" aria-label="Appearance">
          <button class="tile" role="radio" data-mode="light"><span class="thumb"><span class="mini"><i></i><i></i><i></i></span></span><span class="caption">Light</span></button>
          <button class="tile" role="radio" data-mode="glass"><span class="thumb"><span class="mini"><i></i><i></i><i></i></span></span><span class="caption">Glass</span></button>
        </div>
      </div>
      <div class="setting glass-only">
        <span class="label">Liquid Glass</span>
        <div class="glass-slider">
          <svg viewBox="0 0 20 16" aria-hidden="true"><rect x="1.5" y="3.5" width="12" height="9" rx="3"/><rect x="6.5" y="1.5" width="12" height="9" rx="3"/></svg>
          <input id="tint" type="range" min="0" max="100" step="1" aria-label="Liquid Glass, clear to tinted">
          <svg viewBox="0 0 20 16" aria-hidden="true"><rect x="1.5" y="3.5" width="12" height="9" rx="3"/><rect class="fill" x="6.5" y="1.5" width="12" height="9" rx="3"/></svg>
        </div>
      </div>
    </div>
    <h3 class="glass-only">Wallpaper</h3>
    <div class="group glass-only"><div id="wallpapers" role="radiogroup" aria-label="Wallpaper"></div></div>
    <p id="wallpaper-credit" class="glass-only"></p>
  </section>
</div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="renderer.js"></script>
</body>
</html>
